[project]
name = "osrip-api"
version = "0.1.0"
description = "OSRIP academic prototype API (FastAPI + PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1,<0.142",      # FastAPI ships breaking changes in minor releases; pin the minor
    "uvicorn[standard]>=0.46,<0.47",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "sqlalchemy>=2.0.40,<2.1",      # 2.1 was still a release candidate when this was written
    "alembic>=1.20,<1.21",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=25.1,<26",        # Argon2id password hashing (booklet 3.15)
    "python-multipart>=0.0.20",     # multipart CSV upload parsing for POST /imports
    "httpx>=0.28,<0.29",             # OpenID Connect and the assistant's model API (server side only)
    "pyjwt[crypto]>=2.10,<3",        # ID-token signature and claim validation
    "openai>=2.54,<3",               # official OpenAI SDK: Responses API (server side only)
]

[project.optional-dependencies]
# Optional: lets the research assistant read PDF reports (text only). Without it a PDF is
# reported as "could not be read" and only its search snippet is used.
pdf = ["pypdf>=6.19,<7"]
# Optional: real-time voice for "Talk to Al Mulhim" (room tokens and the agent worker,
# app/voice/agent.py). Without it the Talk workspace uses push-to-talk. Approved 2026-10-08.
voice = ["livekit-agents==1.8.5"]
dev = [
    "pytest>=9,<10",
    "httpx>=0.28,<0.29",
    "ruff>=0.13",
]
# The import pipeline uses the standard-library csv module and Decimal: files are
# small, and pandas' type inference would silently coerce values (e.g. "" -> NaN).

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires PostgreSQL (OSRIP_RUN_DB_TESTS=1, OSRIP_TEST_ADMIN_URL)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# devdb.py runs the local PostgreSQL binaries with fixed argument lists (no shell).
"scripts/devdb.py" = ["S603"]
# Bilingual explanation and card text: sentences are kept whole for review.
"app/domain/explanations.py" = ["E501"]
# Provider payloads written as in the official documentation (one JSON object per line).
"tests/test_ai_providers.py" = ["E501"]
"tests/test_live_study.py" = ["E501"]
"app/domain/forecasting.py" = ["E501"]
"app/domain/scenarios.py" = ["E501"]
"app/services/forecasting.py" = ["E501"]
"app/services/scenarios.py" = ["E501"]
"app/services/phone.py" = ["E501"]
"app/services/reference_pack.py" = ["E501"]
"app/services/conditions.py" = ["E501"]  # bilingual catalogue text
"app/services/mail_templates.py" = ["E501"]  # bilingual e-mail text and inline styles
"tests/test_zz_reference_pack_integration.py" = ["E501"]
"scripts/serve_public.py" = ["E501", "S603"]
"scripts/sms_acceptance.py" = ["E501"]
"app/services/analysis/*.py" = ["E501"]
"app/services/identity.py" = ["E501"]
"app/services/assistant/*.py" = ["E501"]
"app/services/research/*.py" = ["E501"]  # bilingual publisher names and model-facing notes
"app/services/datasets/*.py" = ["E501"]  # bilingual findings and model instructions
"app/services/documents/*.py" = ["E501"]  # bilingual report text and PDF drawing operators
"app/services/speech.py" = ["E501"]
"app/api/routes/assistant.py" = ["E501"]
# Integration tests keep request/response lines whole for readability.
"tests/*_integration.py" = ["E501", "S106"]  # throwaway test passwords
"tests/test_research.py" = ["E501"]  # literal WAV headers and evidence fixtures
"tests/test_documents.py" = ["E501"]  # report fixtures in both languages
"tests/test_sms_twilio.py" = ["E501"]  # provider payloads as in Twilio's documentation
"tests/test_whatsapp.py" = ["E501"]  # provider payloads as in Meta's documentation
"tests/test_mail_templates.py" = ["E501"]
