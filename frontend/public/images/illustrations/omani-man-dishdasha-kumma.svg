<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img" aria-labelledby="t d">
  <title id="t">Illustration: an adult Omani man in a dishdasha and kumma</title>
  <desc id="d">Original illustration created for the OSRIP academic prototype. Not a photograph and not a real person.</desc>
  <defs>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D6A4F"/>
      <stop offset="1" stop-color="#173B2C"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E7E2D6"/>
      <stop offset="0.35" stop-color="#FBFAF6"/>
      <stop offset="0.7" stop-color="#FBFAF6"/>
      <stop offset="1" stop-color="#DEd8CA"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B98563"/>
      <stop offset="1" stop-color="#9C6B4C"/>
    </linearGradient>
    <pattern id="lattice" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M16 3 L19 13 L29 16 L19 19 L16 29 L13 19 L3 16 L13 13 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.2"/>
    </pattern>
    <clipPath id="archClip">
      <path d="M52 560 V238 C52 158 108 110 168 88 C204 74 228 58 240 36 C252 58 276 74 312 88 C372 110 428 158 428 238 V560 Z"/>
    </clipPath>
  </defs>

  <!-- Arch frame, after the pointed arches of Omani forts and doorways -->
  <path d="M40 560 V234 C40 150 100 98 164 74 C200 60 226 42 240 18 C254 42 280 60 316 74 C380 98 440 150 440 234 V560 Z" fill="#C9A96E"/>
  <g clip-path="url(#archClip)">
    <rect width="480" height="560" fill="url(#arch)"/>
    <rect width="480" height="560" fill="url(#lattice)"/>

    <!-- Dishdasha: shoulders and chest -->
    <path d="M78 560 C80 468 104 410 158 384 C182 372 204 360 214 336 L266 336 C276 360 298 372 322 384 C376 410 400 468 402 560 Z" fill="url(#robe)"/>
    <path d="M160 404 C150 450 146 505 148 560" fill="none" stroke="#D8D1C1" stroke-width="3"/>
    <path d="M320 404 C330 450 334 505 332 560" fill="none" stroke="#D8D1C1" stroke-width="3"/>

    <!-- Neck -->
    <path d="M210 282 L270 282 L272 340 C258 352 222 352 208 340 Z" fill="url(#skin)"/>
    <path d="M210 318 C226 330 254 330 270 318 L271 340 C257 350 223 350 209 340 Z" fill="#8E5F43" opacity="0.35"/>

    <!-- Round collar with centre seam -->
    <path d="M204 334 C214 356 266 356 276 334" fill="none" stroke="#CFC7B5" stroke-width="5" stroke-linecap="round"/>
    <path d="M240 354 L240 470" stroke="#D9D2C2" stroke-width="3"/>

    <!-- Furakha (tassel hanging from the collar) -->
    <path d="M244 352 C247 380 246 406 248 430" fill="none" stroke="#B08D57" stroke-width="3" stroke-linecap="round"/>
    <path d="M241 428 C241 436 244 452 248 460 C252 452 255 436 255 428 C255 423 241 423 241 428 Z" fill="#B08D57"/>
    <path d="M244 432 L244 455 M248 432 L248 460 M252 432 L252 455" stroke="#8F6E3F" stroke-width="1.2"/>

    <!-- Ears -->
    <ellipse cx="178" cy="228" rx="11" ry="19" fill="#A9765A"/>
    <ellipse cx="302" cy="228" rx="11" ry="19" fill="#A9765A"/>

    <!-- Face -->
    <ellipse cx="240" cy="226" rx="62" ry="80" fill="url(#skin)"/>

    <!-- Beard and moustache (short, neatly trimmed) -->
    <path d="M180 226 C181 282 206 318 240 320 C274 318 299 282 300 226 C296 250 288 264 276 270 C266 262 254 258 240 258 C226 258 214 262 204 270 C192 264 184 250 180 226 Z" fill="#2B211B"/>
    <path d="M218 262 C226 256 234 256 240 259 C246 256 254 256 262 262 C254 266 246 266 240 264 C234 266 226 266 218 262 Z" fill="#2B211B"/>
    <path d="M228 276 C236 280 244 280 252 276" fill="none" stroke="#6E3F2E" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes, brows, nose -->
    <path d="M206 205 C214 199 224 199 231 203" fill="none" stroke="#2B211B" stroke-width="4" stroke-linecap="round"/>
    <path d="M249 203 C256 199 266 199 274 205" fill="none" stroke="#2B211B" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="219" cy="218" rx="6" ry="4" fill="#241A15"/>
    <ellipse cx="261" cy="218" rx="6" ry="4" fill="#241A15"/>
    <path d="M240 222 C238 234 235 242 236 248 C239 251 243 251 246 248" fill="none" stroke="#7F5039" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Kumma (embroidered cap) -->
    <path d="M176 176 C178 136 204 112 240 110 C276 112 302 136 304 176 C290 170 266 166 240 166 C214 166 190 170 176 176 Z" fill="#FBFAF6"/>
    <path d="M176 176 C190 170 214 166 240 166 C266 166 290 170 304 176 L304 184 C290 178 266 174 240 174 C214 174 190 178 176 184 Z" fill="#E4DDCD"/>
    <g fill="none" stroke-linecap="round">
      <path d="M186 156 C204 146 222 142 240 142 C258 142 276 146 294 156" stroke="#1F4D3A" stroke-width="3"/>
      <path d="M198 134 C212 126 226 122 240 122 C254 122 268 126 282 134" stroke="#7A2E3A" stroke-width="2.5"/>
    </g>
    <g fill="#1F4D3A">
      <path d="M200 162 l5 -6 l5 6 l-5 6 z"/><path d="M220 158 l5 -6 l5 6 l-5 6 z"/><path d="M240 157 l5 -6 l5 6 l-5 6 z" transform="translate(-5 0)"/>
      <path d="M255 158 l5 -6 l5 6 l-5 6 z"/><path d="M275 162 l5 -6 l5 6 l-5 6 z"/>
    </g>
    <g fill="#7A2E3A">
      <circle cx="210" cy="146" r="2.2"/><circle cx="226" cy="140" r="2.2"/><circle cx="240" cy="138" r="2.2"/>
      <circle cx="254" cy="140" r="2.2"/><circle cx="270" cy="146" r="2.2"/>
    </g>
    <g fill="#C9A96E">
      <circle cx="220" cy="128" r="1.8"/><circle cx="240" cy="126" r="1.8"/><circle cx="260" cy="128" r="1.8"/>
    </g>
  </g>
  <!-- Arch outline -->
  <path d="M52 560 V238 C52 158 108 110 168 88 C204 74 228 58 240 36 C252 58 276 74 312 88 C372 110 428 158 428 238 V560" fill="none" stroke="#C9A96E" stroke-width="3"/>
</svg>
